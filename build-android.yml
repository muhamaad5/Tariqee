name: Build Tareeqi Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Remove preinstalled NDK (avoids corrupted NDK)
        run: |
          sudo rm -rf "$ANDROID_HOME/ndk" "$ANDROID_SDK_ROOT/ndk" || true
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Flutter 3.27.4 (pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name tareeqi --org com.tareeqi

      - name: Set Arabic app name
        run: sed -i 's/android:label="[^"]*"/android:label="طريقي"/' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Check Dart code (shows exact errors)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tareeqi-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
